name: Playwright UI Tests

on:
  workflow_dispatch:
    inputs:
      github_environment:
        description: GitHub environment that contains USERNAME, URL, and PASSWORD
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    environment: ${{ inputs.github_environment }}

    env:
      URL: ${{ vars.URL != '' && vars.URL || secrets.URL }}
      USERNAME: ${{ vars.USERNAME != '' && vars.USERNAME || secrets.USERNAME }}
      PASSWORD: ${{ secrets.PASSWORD != '' && secrets.PASSWORD || vars.PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify injected environment values
        shell: bash
        run: |
          test -n "$URL" || { echo "URL missing"; exit 1; }

          test -n "$USERNAME" || { echo "USERNAME missing"; exit 1; }
          test -n "$PASSWORD" || { echo "PASSWORD missing"; exit 1; }

          echo "Environment loaded successfully"

      - name: Install Playwright browser
        run: mvn -q -DskipTests exec:java -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install --with-deps chromium"

      - name: Run login suite
        run: mvn -q -DagentConfig=missing.properties verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-cucumber-reports
          path: |
            target/cucumber-reports/
            target/failsafe-reports/
          if-no-files-found: warn