name: Playwright UI Tests

on:
  workflow_dispatch:
    inputs:
      github_environment:
        description: GitHub environment that contains USERNAME, URL, and PASSWORD
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    environment: QA

    env:
      URL: ${{ vars.URL }}
      USERNAME: ${{ secrets.USERNAME }}
      PASSWORD: ${{ secrets.PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Verify injected environment values
        run: |
          echo "URL=$URL"

          if [ -z "$USERNAME" ]; then
            echo "USERNAME missing"
            exit 1
          fi

          if [ -z "$PASSWORD" ]; then
            echo "PASSWORD missing"
            exit 1
          fi

          echo "Environment loaded successfully"