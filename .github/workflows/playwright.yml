name: Playwright UI Tests

on:
  workflow_dispatch:
    inputs:
      github_environment:
        description: GitHub environment that contains USERNAME, URL, and PASSWORD
        required: true
        type: environment

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    environment: ${{ inputs.github_environment }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Resolve environment values
        shell: bash
        env:
          SELECTED_ENVIRONMENT: ${{ inputs.github_environment }}
          VAR_URL: ${{ vars.URL }}
          SECRET_URL: ${{ secrets.URL }}
          VAR_USERNAME: ${{ vars.USERNAME }}
          SECRET_USERNAME: ${{ secrets.USERNAME }}
          VAR_PASSWORD: ${{ vars.PASSWORD }}
          SECRET_PASSWORD: ${{ secrets.PASSWORD }}
        run: |
          echo "Selected environment: $SELECTED_ENVIRONMENT"

          resolve_value() {
            local key="$1"
            local variable_value="$2"
            local secret_value="$3"
            local selected_value=""
            local source=""

            if [ -n "$variable_value" ]; then
              selected_value="$variable_value"
              source="vars"
            elif [ -n "$secret_value" ]; then
              selected_value="$secret_value"
              source="secrets"
            else
              echo "$key missing in both vars and secrets"
              exit 1
            fi

            {
              printf '%s<<EOF\n' "$key"
              printf '%s\n' "$selected_value"
              printf 'EOF\n'
              printf '%s_SOURCE=%s\n' "$key" "$source"
            } >> "$GITHUB_ENV"
          }

          resolve_value URL "$VAR_URL" "$SECRET_URL"
          resolve_value USERNAME "$VAR_USERNAME" "$SECRET_USERNAME"
          resolve_value PASSWORD "$VAR_PASSWORD" "$SECRET_PASSWORD"

      - name: Verify injected environment values
        shell: bash
        run: |
          test -n "$URL" || { echo "URL missing"; exit 1; }

          test -n "$USERNAME" || { echo "USERNAME missing"; exit 1; }
          test -n "$PASSWORD" || { echo "PASSWORD missing"; exit 1; }

          echo "URL source: $URL_SOURCE"
          echo "USERNAME source: $USERNAME_SOURCE"
          echo "PASSWORD source: $PASSWORD_SOURCE"
          echo "Environment loaded successfully"

      - name: Install Playwright browser
        run: mvn -q -DskipTests exec:java -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install --with-deps chromium"

      - name: Run login suite
        run: mvn -q -DagentConfig=missing.properties verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-cucumber-reports
          path: |
            target/cucumber-reports/
            target/failsafe-reports/
          if-no-files-found: warn